<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAO Elite — dom na części pierwsze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f1; --ink:#1d2126; --muted:#6d7278; --line:#e2dfd9;
  --accent:#c05a3c; --accent-d:#a34a30; --accent-l:#e08a68;
  --panel:#ffffff; --chip:#f0eee9;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

.dom3d{max-width:1400px;margin:0 auto;padding:48px 24px 40px}
.dom3d-head{text-align:center;max-width:820px;margin:0 auto 22px}
.dom3d-head .kicker{font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.dom3d-head h2{font-size:clamp(1.6rem,3.2vw,2.6rem);line-height:1.12;margin:.5rem 0 .6rem;font-weight:800;letter-spacing:-.01em}
.dom3d-head p{color:var(--muted);margin:0;font-size:1rem;line-height:1.55}

.dom3d-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:stretch}
@media(max-width:1020px){.dom3d-grid{grid-template-columns:1fr}}

/* ------------------------------------------------ scena */
.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;height:min(68vh,640px);min-height:420px;border-radius:14px;overflow:hidden;
  background:transparent}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.stage canvas.hov{cursor:pointer}
.stage canvas.drag{cursor:grabbing}
.stage-tip{position:absolute;left:14px;bottom:12px;font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.78);
  padding:.35rem .6rem;border-radius:20px;backdrop-filter:blur(6px);pointer-events:none}
.mode-title{position:absolute;left:0;right:0;top:14px;text-align:center;pointer-events:none;transition:opacity .4s var(--ease)}
.mode-title{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 64px}
.mode-title button{pointer-events:auto;cursor:pointer;border:none;font-family:inherit;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.5rem .95rem;border-radius:20px;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 4px 14px rgba(20,24,30,.12);transition:all .25s var(--ease)}
.mode-title button:hover{background:#fff;color:var(--accent)}
.mode-title button.on{background:rgba(29,33,38,.9);color:#fff}
.nav-back{position:absolute;left:14px;top:12px;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;z-index:3;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:1.25rem;line-height:1;box-shadow:0 4px 14px rgba(20,24,30,.14);
  display:flex;align-items:center;justify-content:center;transition:opacity .3s var(--ease), transform .3s var(--ease), background .2s}
.nav-back:hover{background:var(--accent);color:#fff}
.nav-back.off{opacity:0;pointer-events:none;transform:translateX(-8px)}
.mode-title b{display:inline-block;background:rgba(29,33,38,.86);color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.45rem .9rem;border-radius:20px}

/* etykiety nad czesciami domu */
.labels{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;
  display:flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.94);color:var(--ink);font-size:.76rem;font-weight:700;
  padding:.38rem .7rem .38rem .45rem;border-radius:20px;box-shadow:0 6px 18px rgba(20,24,30,.14);white-space:nowrap;
  transition:opacity .35s var(--ease), transform .35s var(--ease), background .2s}
.hs i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(192,90,60,.6);animation:puls 2s infinite}
.hs:hover{background:var(--accent);color:#fff}
.hs:hover i{background:#fff}
.hs.off{opacity:0;pointer-events:none;transform:translate(-50%,-30%);visibility:hidden;transition:opacity .35s, transform .35s, visibility 0s .35s}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(192,90,60,.55)}70%{box-shadow:0 0 0 10px rgba(192,90,60,0)}100%{box-shadow:0 0 0 0 rgba(192,90,60,0)}}
.ly{position:absolute;transform:translate(-100%,-50%);pointer-events:auto;font-size:.7rem;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.92);padding:.28rem .55rem;border-radius:4px;white-space:nowrap;box-shadow:0 3px 10px rgba(20,24,30,.12);
  border-left:3px solid var(--accent);transition:opacity .3s}
.ly.r{transform:translate(0,-50%)}
.ly em{font-style:normal;color:var(--muted);font-weight:500;margin-right:.35rem}
.ly.on{background:var(--accent);color:#fff}.ly.on em{color:#fde4da}

/* pasek kolorow pod domem */
.bar{background:var(--panel);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px;min-height:74px;
  display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.bar-grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-lbl{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;background:var(--chip);border-radius:8px;padding:3px}
.tabs button{border:none;background:none;padding:.42rem .75rem;border-radius:6px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,24,30,.12)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;padding:0;
  transition:transform .2s var(--ease), box-shadow .2s}
.sw button:hover{transform:translateY(-2px)}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
.sw button span{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:.62rem;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.sw button:hover span,.sw button.on span{opacity:1}
.sw.stone button{border-radius:8px;width:42px}
.chipsvc{border:none;background:var(--chip);border-radius:20px;padding:.45rem .8rem;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink);transition:all .2s}
.chipsvc:hover{background:var(--accent);color:#fff}

/* ------------------------------------------------ panel danych (prawa strona) */
.panel{background:var(--panel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:22px 22px 18px;
  max-height:calc(min(68vh,640px) + 86px);overflow-y:auto;position:relative}
@media(max-width:1020px){.panel{max-height:none}}
.panel .in{animation:wej .45s var(--ease)}
/* osadzone w iframe na stronie glownej: bez vh (vh liczy sie od ramki) */
.embed body{overflow:hidden}
.embed .stage{height:620px}
.embed .panel{max-height:706px}
@media(max-width:700px){.embed .stage{height:440px;min-height:0}}
@keyframes wej{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back{border:none;background:none;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.back:hover{color:var(--accent)}
.p-kick{font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.panel h3{font-size:1.35rem;line-height:1.2;margin:.35rem 0 .5rem;font-weight:800}
.lead{color:var(--muted);font-size:.9rem;line-height:1.55;margin:0 0 14px}
.sibs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.sibs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:.35rem .7rem;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--ink)}
.sibs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sec{margin:16px 0 0}
.sec h4{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:.45rem 0 .45rem 2.1rem;font-size:.87rem;line-height:1.45;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:none}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.42rem;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--chip);
  font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--accent)}
ul.why{margin:0;padding:0;list-style:none}
ul.why li{position:relative;padding:.3rem 0 .3rem 1.4rem;font-size:.87rem;line-height:1.45}
ul.why li::before{content:"";position:absolute;left:0;top:.62rem;width:.7rem;height:.38rem;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
ul.layers{margin:0;padding:0;list-style:none}
ul.layers li{display:flex;align-items:center;gap:.6rem;padding:.42rem .5rem;font-size:.84rem;border-radius:6px;cursor:default;transition:background .15s}
ul.layers li:hover,ul.layers li.on{background:#fbefea}
ul.layers li b{width:1.4rem;height:1.4rem;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
ul.layers li small{margin-left:auto;color:var(--muted);font-size:.7rem}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.btn{border:none;cursor:pointer;padding:.62rem 1rem;border-radius:5px;font-size:.8rem;font-weight:700;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;transition:all .2s}
.btn-a{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(192,90,60,.25)}
.btn-a:hover{background:var(--accent-d)}
.btn-g{background:var(--chip);color:var(--ink)}
.btn-g:hover{background:#e6e3dc}
.ba{margin-top:6px}
.ba-row{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ba input{width:100%;accent-color:var(--accent)}
.sto{display:inline-flex;align-items:center;gap:.5rem;margin-top:10px;font-size:.74rem;color:var(--muted)}
.sto .logo{display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:52px;padding:0 .6rem;border-radius:3px;
  background:#1d2126;color:#fff;font-weight:800;letter-spacing:.04em;font-size:.86rem}
.sto img{height:26px;display:block}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal div{aspect-ratio:4/3;border-radius:6px;background:#efede8;box-shadow:inset 0 0 0 1px var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:.6rem;color:var(--muted);padding:4px;line-height:1.3}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.7rem .7rem;text-align:left;cursor:pointer;
  font-size:.8rem;font-weight:700;color:var(--ink);line-height:1.3;transition:all .2s var(--ease)}
.svc button small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;margin-top:.2rem}
.svc button:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,24,30,.08)}
/* callout: zdjecie + krotki opis "tak robimy" (lewy gorny rog sceny) + linia do klikniętej warstwy */
.callout{position:absolute;left:14px;top:66px;width:236px;z-index:2;color:var(--ink);animation:wej .35s var(--ease)}
.callout[hidden]{display:none}
.co-foto{width:100%;aspect-ratio:4/3;border-radius:50% / 44%;background:#efede8;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden;position:relative}
.co-foto img{width:100%;height:100%;object-fit:cover;display:block}
.co-tyt{margin:.6rem 0 .25rem;font-size:1.05rem;font-weight:800;line-height:1.2}
.co-txt{margin:0;font-size:.8rem;line-height:1.45;color:#3a4047}
.co-x{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border:none;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:.9rem;line-height:1}
.co-x:hover{background:var(--accent)}
.lead-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.lead-line path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.lead-line circle{fill:var(--accent);stroke:#fff;stroke-width:2}
@media(max-width:700px){.callout{width:150px;top:62px}.co-foto{display:none}.co-txt{font-size:.72rem}}
/* galeria wykonu (pasek na dole, przewijany, dowolnie dluga) */
.gal-sec{margin-top:16px;background:var(--panel);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 14px 16px}
.gal-head{display:flex;align-items:baseline;gap:.7rem;margin-bottom:10px;flex-wrap:wrap}
.gal-head b{font-size:.95rem;font-weight:800}
.gal-head small{color:var(--muted);font-size:.74rem}
.gal-head .arr{margin-left:auto;display:flex;gap:6px}
.gal-head .arr button{width:32px;height:32px;border:none;border-radius:50%;background:var(--chip);cursor:pointer;font-size:1rem;color:var(--ink)}
.gal-head .arr button:hover{background:var(--accent);color:#fff}
.gal-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
.gi{flex:none;width:200px;aspect-ratio:4/3;border:none;padding:0;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;
  background:#efede8;box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s var(--ease), box-shadow .2s}
.gi:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--accent), 0 8px 18px rgba(20,24,30,.12)}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
.gi .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(29,33,38,.75);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1rem;padding-left:3px}
.gi .cap{position:absolute;left:0;right:0;bottom:0;padding:.5rem .6rem;font-size:.7rem;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);text-align:left}
.gi.pusty{cursor:default;pointer-events:none}
.lb{position:fixed;inset:0;z-index:99;background:rgba(10,12,15,.9);display:flex;align-items:center;justify-content:center;padding:24px}
.lb[hidden]{display:none}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:6px;background:#000}
.lb button{position:absolute;border:none;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.lb button:hover{background:var(--accent)}
.lb .lbx{right:18px;top:16px}.lb .lbp{left:16px;top:50%}.lb .lbn{right:16px;top:50%}
.lb .lbc{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:.85rem}
.note{font-size:.7rem;color:var(--muted);margin-top:14px;line-height:1.45}
</style>
</head>
<body>

<section class="dom3d" id="dom3d">
  <div class="dom3d-head">
    <div class="kicker">Interaktywny dom PAO Elite</div>
    <h2>Kliknij część domu — rozłożymy ją na części pierwsze</h2>
    <p>Dach, elewacja, dach płaski, garaż, taras i schody. Zobacz, z czego są zbudowane, co robimy i jak to będzie wyglądać u Ciebie.</p>
  </div>

  <div class="dom3d-grid">
    <div class="stage-col">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Model 3D domu — kliknij część, aby zobaczyć usługę"></canvas>
        <div class="labels" id="labels"></div>
        <svg class="lead-line" id="leadLine" hidden><path id="leadPath" d=""/><circle id="leadDot" r="5"/></svg>
        <div class="callout" id="callout" hidden></div>
        <div class="mode-title" id="modeTitle"></div>
        <button class="nav-back off" id="navBack" type="button" aria-label="Wstecz — poprzedni widok" title="Wstecz">←</button>
        <div class="stage-tip" id="tip">przeciągnij, aby obrócić · kliknij część domu</div>
      </div>
      <div class="bar" id="bar"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <section class="gal-sec" id="galSec" aria-label="Galeria realizacji"></section>
  <div class="lb" id="lb" hidden><button class="lbx" type="button" aria-label="Zamknij">×</button><button class="lbp" type="button" aria-label="Poprzednie">‹</button><button class="lbn" type="button" aria-label="Następne">›</button><div id="lbBody"></div><div class="lbc" id="lbCap"></div></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const stage = $("#stage"), cv = $("#cv"), labelsEl = $("#labels"), panelEl = $("#panel"), barEl = $("#bar");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =========================================================== DANE / TRESCI */
const COVER = {
  ceramiczna: {nazwa:"Dachówka ceramiczna", kolory:[["RAL 8002 Czerwony brąz","#7b5141"],["RAL 8011 Moka","#5a3826"],["RAL 8017 Ciemny brąz","#45322e"],["RAL 7024 Antracyt","#474a51"],["RAL 9005 Czarny","#151617"],["RAL 8012 Szwedzka czerwień","#66332b"],["RAL 6012 Zielony","#343e40"],["RAL 5022 Niebieski","#222d5a"]]},
  cementowa:  {nazwa:"Dachówka cementowa",  kolory:[["RAL 8002 Czerwony brąz","#7b5141"],["RAL 8011 Moka","#5a3826"],["RAL 8017 Ciemny brąz","#45322e"],["RAL 7024 Antracyt","#474a51"],["RAL 9005 Czarny","#151617"],["RAL 8012 Szwedzka czerwień","#66332b"],["RAL 6012 Zielony","#343e40"],["RAL 5022 Niebieski","#222d5a"]]},
  blacha:     {nazwa:"Blachodachówka",      kolory:[["RAL 7016 Szary antracytowy","#383e42"],["RAL 8017 Brąz czekoladowy","#45322e"],["RAL 3009 Czerwony tlenkowy","#642424"],["RAL 3004 Purpurowo czerwony","#75151e"],["RAL 6005 Zielony mech","#114232"],["RAL 5010 Niebieski goryczkowy","#0e294b"],["RAL 9006 Srebrny aluminium","#a5a5a5"]]},
  eternit:    {nazwa:"Eternit (stare pokrycie)", kolory:[["Eternit","#8d918c"]]}
};
const FASADA = [["Biel","#f2f0ea"],["Kość słoniowa","#ece2cc"],["Piaskowy","#dccdab"],["Jasna szarość","#d2d3cf"],["Szałwia","#c0c7b1"],["Grafit","#62676b"]];
const POSADZKA = [["Szary","#8d9195"],["Grafit","#4a4e53"],["Beżowy","#b7a98f"],["Niebiesko-szary","#6b7d8d"],["Piaskowy","#c6b68f"],["Czerwony","#8a3a32"]];
const KAMIEN = [
  ["Bianco",      ["#f2f0ec","#dcd9d2","#c9c5bd","#ffffff"]],
  ["Grigio",      ["#a9a9a6","#8b8c8a","#c8c8c4","#6f706e"]],
  ["Rosso Verona",["#b8735f","#d29a86","#9a5848","#e2bba9"]],
  ["Nero",        ["#2c2c2c","#4a4a49","#1a1a1a","#6b6b69"]],
  ["Giallo",      ["#d8c08f","#e8d6ad","#bfa271","#f2e6c8"]],
  ["Mix brązowy", ["#8a6a4e","#b08d6c","#6a4f3a","#cdb294"]]
];

const ROOF_LAYERS = [
  {id:"welna",     nazwa:"Ocieplenie — wełna mineralna", kol:"#e2c35a"},
  {id:"krokwie",   nazwa:"Więźba — krokwie",             kol:"#a8774e"},
  {id:"deski",     nazwa:"Deskowanie pełne",             kol:"#c79a6b"},
  {id:"membrana",  nazwa:"Membrana dachowa",             kol:"#3f6e98"},
  {id:"kontrlaty", nazwa:"Kontrłaty",                    kol:"#b98a5c"},
  {id:"laty",      nazwa:"Łaty",                         kol:"#cfa476"},
  {id:"pokrycie",  nazwa:"Pokrycie",                     kol:"#b4553a"}
];
const WALL_LAYERS = [
  {id:"mur",    nazwa:"Mur — ściana nośna",                         th:.30,  kol:"#a5583f"},
  {id:"klej",   nazwa:"Klej do płyt",                               th:.012, kol:"#9a9993"},
  {id:"eps",    nazwa:"Ocieplenie — styropian",                     th:.14,  kol:"#f4f4f1"},
  {id:"siatka", nazwa:"Zaprawa klejowa + siatka z włókna szklanego", th:.012, kol:"#c9d9b4"},
  {id:"grunt",  nazwa:"Grunt podtynkowy",                           th:.004, kol:"#e8e3d3"},
  {id:"tynk",   nazwa:"Tynk Sto",                                   th:.015, kol:"#ede7da"},

/* ---------- tekstury z canvas (bez plików zewnętrznych) */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ctex(w, h, draw, rep){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = ANISO;
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t._g = g; t._c = c; t._draw = draw;
  return t;
}
function redraw(t, draw){ t._g.clearRect(0, 0, t._c.width, t._c.height); (draw || t._draw)(t._g, t._c.width, t._c.height); t.needsUpdate = true; }
function shade(hex, f){ const c = new THREE.Color(hex); c.offsetHSL(0, 0, f); return "#" + c.getHexString(); }
function blob(g, x, y, r, col, a){ const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace("A", a)); gr.addColorStop(1, col.replace("A", 0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

function drawWood(base){
  return (g, w, h) => {
    const R = rng(7); const rows = 8, rh = h / rows;
    for (let i = 0; i < rows; i++){
      g.fillStyle = shade(base, (R() - .5) * .08); g.fillRect(0, i * rh, w, rh);
      g.strokeStyle = "rgba(60,35,15,.18)"; g.lineWidth = 1;
      for (let k = 0; k < 6; k++){ const y = i * rh + R() * rh; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + R() * 4 - 2, w * .6, y + R() * 4 - 2, w, y); g.stroke(); }
      g.fillStyle = "rgba(40,25,10,.35)"; g.fillRect(0, i * rh, w, 2);
    }
  };
}
const texBrick = ctex(512, 256, (g, w, h) => {
  const R = rng(3); g.fillStyle = "#cfc8bb"; g.fillRect(0, 0, w, h);
  const bh = 32, bw = 64;
  for (let r = 0; r < h / bh; r++) for (let c = -1; c < w / bw + 1; c++){
    const x = c * bw + (r % 2 ? bw / 2 : 0);
    g.fillStyle = shade("#a5583f", (R() - .5) * .12); g.fillRect(x + 2, r * bh + 2, bw - 4, bh - 4);
  }
}, true);
const texWool = (dmg) => (g, w, h) => {
  const R = rng(11); g.fillStyle = "#e2c35a"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(150,110,30,.35)"; g.lineWidth = 1.2;
  for (let i = 0; i < 900; i++){ const x = R() * w, y = R() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + R() * 14 - 7, y + R() * 6 - 3); g.stroke(); }
  if (dmg){
    for (let i = 0; i < 7; i++){ const x = R() * w, y = R() * h, r = 18 + R() * 30;
      g.fillStyle = "rgba(70,55,40,.85)"; g.beginPath(); g.ellipse(x, y, r, r * .6, R() * 3, 0, 7); g.fill();
      g.strokeStyle = "rgba(120,90,40,.9)"; for (let k = 0; k < 14; k++){ g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * r * 2.6, y + (R() - .5) * r * 1.6); g.stroke(); } }
  }
};

/* pokrycie dachu: dachowka/blacha + mech (dirt 0..1) */
const coverState = {typ:"ceramiczna", kolor:"#b4553a", dirt:0};
function drawCover(g, w, h){
  const {typ, kolor, dirt} = coverState; const R = rng(21);
  const n = 8, tw = w / n;
  if (typ === "blacha"){
    for (let i = 0; i < n; i++){
      const gr = g.createLinearGradient(i * tw, 0, (i + 1) * tw, 0);
      gr.addColorStop(0, shade(kolor, .07)); gr.addColorStop(.45, shade(kolor, .14)); gr.addColorStop(.55, shade(kolor, -.02)); gr.addColorStop(1, shade(kolor, -.09));
      g.fillStyle = gr; g.fillRect(i * tw, 0, tw, h);
    }
    const st = g.createLinearGradient(0, 0, 0, h); st.addColorStop(0, "rgba(255,255,255,.12)"); st.addColorStop(.85, "rgba(0,0,0,0)"); st.addColorStop(1, "rgba(0,0,0,.45)");
    g.fillStyle = st; g.fillRect(0, 0, w, h);
  } else if (typ === "eternit"){
    for (let x = 0; x < w; x += 16){ const gr = g.createLinearGradient(x, 0, x + 16, 0);
      gr.addColorStop(0, "#9a9e99"); gr.addColorStop(.5, "#80847f"); gr.addColorStop(1, "#9a9e99"); g.fillStyle = gr; g.fillRect(x, 0, 16, h); }
    for (let i = 0; i < 40; i++) blob(g, R() * w, R() * h, 6 + R() * 18, "rgba(90,100,70,A)", .55);
    for (let i = 0; i < 30; i++) blob(g, R() * w, R() * h, 3 + R() * 7, "rgba(210,200,120,A)", .5);
  } else {
    for (let i = 0; i < n; i++){
      const c = shade(kolor, (R() - .5) * .05);
      if (typ === "ceramiczna"){
        const gr = g.createLinearGradient(i * tw, 0, (i + 1) * tw, 0);
        gr.addColorStop(0, shade(c, -.1)); gr.addColorStop(.35, shade(c, .08)); gr.addColorStop(.6, c); gr.addColorStop(1, shade(c, -.14));
        g.fillStyle = gr;
      } else g.fillStyle = c;
      g.fillRect(i * tw, 0, tw, h);
      g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect((i + 1) * tw - 2, 0, 2, h);
    }
    const st = g.createLinearGradient(0, 0, 0, h); st.addColorStop(0, "rgba(255,255,255,.06)"); st.addColorStop(.8, "rgba(0,0,0,0)"); st.addColorStop(1, "rgba(0,0,0,.5)");
    g.fillStyle = st; g.fillRect(0, 0, w, h);
  }
  if (dirt > .01 && typ !== "eternit"){
    g.fillStyle = `rgba(70,74,60,${.45 * dirt})`; g.fillRect(0, 0, w, h);
    const R2 = rng(5);
    for (let i = 0; i < 46; i++) blob(g, R2() * w, R2() * h, 6 + R2() * 22, "rgba(78,98,52,A)", .85 * dirt);
    for (let i = 0; i < 26; i++) blob(g, R2() * w, R2() * h, 3 + R2() * 8, "rgba(190,185,120,A)", .7 * dirt);
  }
}
const texCover = ctex(512, 128, drawCover, true);

const facadeState = {kolor:"#f2f0ea", dirt:0};
function drawFacade(g, w, h){
  const {kolor, dirt} = facadeState; const R = rng(9);
  g.fillStyle = kolor; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++){ g.fillStyle = `rgba(0,0,0,${R() * .035})`; g.fillRect(R() * w, R() * h, 2, 2); }
  if (dirt > .01){
    g.fillStyle = `rgba(110,104,88,${.28 * dirt})`; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++){ const x = R() * w; const gr = g.createLinearGradient(0, 0, 0, h * (.25 + R() * .3));
      gr.addColorStop(0, `rgba(70,72,60,${.55 * dirt})`); gr.addColorStop(1, "rgba(70,72,60,0)"); g.fillStyle = gr; g.fillRect(x, 0, 6 + R() * 22, h * .6); }
    const gb = g.createLinearGradient(0, h * .72, 0, h); gb.addColorStop(0, "rgba(80,90,60,0)"); gb.addColorStop(1, `rgba(72,86,50,${.75 * dirt})`);
    g.fillStyle = gb; g.fillRect(0, h * .7, w, h * .3);
    for (let i = 0; i < 30; i++) blob(g, R() * w, h * (.6 + R() * .4), 20 + R() * 50, "rgba(70,85,48,A)", .5 * dirt);
    g.strokeStyle = `rgba(60,58,52,${.7 * dirt})`; g.lineWidth = 2;
    for (let i = 0; i < 6; i++){ let x = R() * w, y = R() * h; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 6; k++){ x += (R() - .5) * 40; y += R() * 30; g.lineTo(x, y); } g.stroke(); }
  }
}

function drawFloor(g, w, h){

  const chips = ["#f3f3f1", "#1d1e20", "#a8adb2", shade(floorState.kolor, .18)];
  for (let i = 0; i < 2600; i++){ g.fillStyle = chips[(R() * chips.length) | 0]; g.save(); g.translate(R() * w, R() * h); g.rotate(R() * 3);
    g.fillRect(-3, -2, 3 + R() * 5, 2 + R() * 3); g.restore(); }
  const gl = g.createRadialGradient(w * .45, h * .35, 0, w * .45, h * .35, w * .6); gl.addColorStop(0, "rgba(255,255,255,.16)"); gl.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gl; g.fillRect(0, 0, w, h);
}

const stoneState = {cols:KAMIEN[2][1]};
function drawStone(g, w, h){
  const R = rng(41); g.fillStyle = shade(stoneState.cols[0], -.15); g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++){
    const x = R() * w, y = R() * h, r = 2 + R() * 4.2, c = stoneState.cols[(R() * stoneState.cols.length) | 0];

      g.fillStyle = "rgba(255,255,255,.28)"; g.beginPath(); g.arc(x + dx - r * .3, y + dy - r * .3, r * .28, 0, 7); g.fill();

}

const texTar = ctex(512, 512, (g, w, h) => {
  const R = rng(51); g.fillStyle = "#3b3c3a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++){ g.fillStyle = `rgba(255,255,255,${R() * .06})`; g.fillRect(R() * w, R() * h, 2, 2); }
  g.strokeStyle = "rgba(20,20,20,.9)"; g.lineWidth = 2;
  for (let i = 0; i < 14; i++){ let x = R() * w, y = R() * h; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 8; k++){ x += (R() - .5) * 50; y += (R() - .5) * 50; g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 6; i++) blob(g, R() * w, R() * h, 30 + R() * 50, "rgba(90,110,120,A)", .45);
  g.fillStyle = "rgba(0,0,0,.35)"; for (let y = 64; y < h; y += 128) g.fillRect(0, y, w, 3);
});
const resinState = {p:1};
const RES_PTS = (() => { const R = rng(61), pts = []; for (let i = 0; i < 70; i++) pts.push([R(), R(), .08 + R() * .16, R()]); pts.sort((a, b) => a[3] - b[3]); return pts; })();
const texResinMask = ctex(256, 256, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  const p = resinState.p; if (p <= 0) return;
  if (p >= 1){ g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); return; }
  // fala zywicy plynie od naroznika: krawedz po przekatnej z lagodnym falowaniem
  const reach = p * (w + h) * 1.08;
  g.fillStyle = "#fff"; g.beginPath(); g.moveTo(0, 0);
  for (let y = 0; y <= h; y += 4){
    const x = reach - y + Math.sin(y * .045 + p * 9) * 9 + Math.sin(y * .13 + 2) * 4;
    g.lineTo(Math.max(0, Math.min(w, x)), y);
  }
  g.lineTo(0, h); g.closePath(); g.fill();
  for (const [x, y, r] of RES_PTS){            // drobne "jezyki" na czole fali
    const d = x * w + y * h - reach; if (d < -6 || d > 22) continue;
    g.beginPath(); g.arc(x * w, y * h, r * 34 * (1 - Math.max(0, d) / 22), 0, 7); g.fill();
  }
});
texResinMask.encoding = THREE.LinearEncoding;

/* ---------- rejestr czesci (klikalnosc, podswietlanie) */
const parts = {};
function reg(part, mesh, cast = true){ mesh.userData.part = part; (parts[part] = parts[part] || []).push(mesh); mesh.castShadow = cast; mesh.receiveShadow = true; return mesh; }
function box(w, h, d, mat){ return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }

/* ---------- kreska: kontur krawedzi (nutka rysunkowa) */
const LINE = new THREE.LineBasicMaterial({color:0x1d2126, transparent:true, opacity:.62});
const LINE_SOFT = new THREE.LineBasicMaterial({color:0x1d2126, transparent:true, opacity:.28});
function ink(mesh, soft){ const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), soft ? LINE_SOFT : LINE); e.raycast = () => {}; mesh.add(e); return mesh; }

/* ---------- bez tla: tylko cien pod budynkiem */

/* =========================================================== DOM (nowoczesna stodola: szczyt do frontu) */
const HX = 0, HZ = 0, W = 7.4, D = 9.6, H = 5.1, PL = .45;     // x -3.7..3.7, z -4.8..4.8, cokol 0.45
const house = new THREE.Group(); scene.add(house);
const PITCH = 40 * Math.PI / 180, OV = .6;
const GABLE = (W / 2) * Math.tan(PITCH);                          // wysokosc trojkata szczytu na murze
M.lamele = new THREE.MeshStandardMaterial({map:ctex(256, 512, drawWood("#9a6a43"), true), roughness:.7});

/* --- elewacja frontowa (szczyt, z=+D/2): warstwy od muru do farby, rozkladane wzdluz +z */
const FRONT_TOTAL = WALL_LAYERS.reduce((s, l) => s + l.th, 0);
// otwory: [srodek x, dol y, szer, wys]
const WIN = [[-1.75, PL, 2.9, 2.35], [1.45, PL, 1.1, 2.35], [-1.5, 3.05, 1.5, 1.45], [1.55, 2.95, 1.5, 2.05], [0, 5.55, .9, .9]];
function frontShape(){
  const s = new THREE.Shape(); const hw = W / 2;
  s.moveTo(-hw, 0); s.lineTo(hw, 0); s.lineTo(hw, H); s.lineTo(0, H + GABLE); s.lineTo(-hw, H); s.lineTo(-hw, 0);
  for (const [cx, y, w, h] of WIN){ const p = new THREE.Path(); p.moveTo(cx - w / 2, y); p.lineTo(cx - w / 2, y + h); p.lineTo(cx + w / 2, y + h); p.lineTo(cx + w / 2, y); p.lineTo(cx - w / 2, y); s.holes.push(p); }
  return s;
}
const wallLayers = [];
const FZ = D / 2;                      // zewnetrzna powierzchnia elewacji frontowej
{
  let z = FZ - FRONT_TOTAL;
  WALL_LAYERS.forEach((L, i) => {
    const geo = new THREE.ExtrudeGeometry(frontShape(), {depth:L.th, bevelEnabled:false});
    const mesh = reg("elewacja", ink(new THREE.Mesh(geo, M[L.id]), i < 6));
    const g = new THREE.Group(); g.add(mesh); g.position.set(HX, 0, z); g.userData = {base:z, idx:i, id:L.id, warstwa:"sciana-" + L.id};
    house.add(g); wallLayers.push(g); z += L.th;
  });
  // stolarka (zostaje przy murze): grafitowe ramy + szklo; [1] = drzwi wejsciowe drewniane
  const murZ = wallLayers[0].userData.base;
  WIN.forEach(([cx, y, w, h], n) => {
    const fr = new THREE.Group(), t = .08;
    [[w, t, 0, h / 2 - t / 2], [w, t, 0, -h / 2 + t / 2], [t, h, -w / 2 + t / 2, 0], [t, h, w / 2 - t / 2, 0]].forEach(([a, b, x, yy]) => {
      const m = reg("elewacja", ink(box(a, b, .1, M.rama))); m.position.set(x, yy, 0); fr.add(m); });
    if (n === 1){ const dr = reg("elewacja", ink(box(w - t * 2, h - t * 2, .06, M.lamele))); fr.add(dr);
      const kl = reg("elewacja", box(.04, .9, .06, M.rama)); kl.position.set(w / 2 - .2, 0, .07); fr.add(kl); }
    else { const gl = reg("elewacja", box(w - t * 2, h - t * 2, .02, M.szklo), false); fr.add(gl);
      if (w > 2){ const sl = reg("elewacja", ink(box(t, h - t * 2, .1, M.rama))); sl.position.x = -w * .17; fr.add(sl); } }
    fr.position.set(HX + cx, y + h / 2, murZ + .22); house.add(fr);
  });
  // drewniane lamele przy oknie pietra (jak na wzorze)

}

function vmax(u, W0, W1, L){ if (W0 === W1) return L; return L * Math.max(0, Math.min(1, (W0 / 2 - Math.abs(u)) / ((W0 - W1) / 2))); }
function widthAt(v, W0, W1, L){ return W0 - (W0 - W1) * v / L; }
function uvScale(geo, su, sv){ const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); uv.needsUpdate = true; return geo; }
function plate(W0, W1, L, th, mat, rep){ const g = new THREE.ExtrudeGeometry(trapShape(W0, W1, L), {depth:th, bevelEnabled:false});

function buildSlope(phi, d, W0, W1){

  const rafterU = []; for (let u = -W0 / 2 + .1; u <= W0 / 2 - .05; u += .8) rafterU.push(u);
  rafterU.push(W0 / 2 - .05);
  // 0 welna pomiedzy krokwiami
  const wel = reg("dach", ink(plate(W0 - .2, W1 - .2, L - .1, .13, M.welna, .5), true)); wel.position.set(0, .02, .015); layers[0].add(wel);
  // 1 krokwie
  for (const u of rafterU){ const vm = vmax(u, W0, W1, L) - .02;
    const r = reg("dach", ink(box(.08, vm, .16, M.krokwie), true)); r.position.set(u, vm / 2, .08); layers[1].add(r); }
  // 2 deskowanie
  const desk = reg("dach", ink(plate(W0, W1, L, .025, M.deski, .4), true)); desk.position.z = .165; layers[2].add(desk);
  // 3 membrana
  const mem = reg("dach", ink(plate(W0, W1, L, .006, M.membrana, .3), true)); mem.position.z = .192; layers[3].add(mem);
  // 4 kontrlaty
  for (const u of rafterU){ const vm = vmax(u, W0, W1, L) - .04;
    const k = reg("dach", ink(box(.05, vm, .04, M.kontrlaty), true)); k.position.set(u, vm / 2, .22); layers[4].add(k); }
  // 5 laty
  for (let v = .12; v < L - .05; v += .34){ const l = reg("dach", ink(box(W0 - .04, .05, .04, M.laty), true)); l.position.set(0, v, .26); layers[5].add(l); }
  // 6 pokrycie — rzedy (dachowka) zachodzace na siebie; jedna tekstura dla wszystkich typow
  const R = rng(Math.round(phi * 100) + 7);
  for (let v = 0; v < L - .02; v += .34){

  }

  const kal = reg("dach", ink(box(W0 + .24, .22, .12, M.kalenica))); kal.position.set(0, L - .06, .37); layers[6].add(kal);
  // rynna (zostaje na budynku)
  const ry = reg("dach", ink(box(W0, .14, .16, phi > 0 ? M.rynnaWym : M.rynna))); ry.position.set(0, -.04, .14); sg.add(ry);
  layers.forEach((l, i) => { l.userData = {idx:i, warstwa:"dach-" + ROOF_LAYERS[i].id}; });
  // podbitka: deski pod okapem (pas wzdluz okapu) i pod wiatrownica od frontu — zostaja na budynku

  for (let i = 0; i < nb; i++){
    const v = bw * (i + .5);
    if (phi < 0 && i === 1){   // lewa polac (od frontu, bez garazu): deska z wyszczerbionym kawalkiem do wymiany
      const cut0 = 1.2, cut1 = 2.7;
      [[-W0 / 2, cut0], [cut1, W0 / 2]].forEach(([a, b]) => { const d = reg("podbitka", ink(box(b - a, bw - .015, .025, M.podbitka), true)); d.position.set((a + b) / 2, v, -.03); sg.add(d); });
      podbStare.push(mkWyszczerb(sg, (cut0 + cut1) / 2, v, cut1 - cut0, bw));
      podbNowe.push(mkNowa(sg, (cut0 + cut1) / 2, v, cut1 - cut0, bw));

  const ub = OV / 3;

      podbStare.push(mkWyszczerb(sg, u, (c0 + c1) / 2, ub, c1 - c0, true));
      podbNowe.push(mkNowa(sg, u, (c0 + c1) / 2, ub, c1 - c0, true));

    }
    const d = reg("podbitka", ink(box(ub - .015, len, .025, M.podbitka), true)); d.position.set(u, vOv + len / 2, -.03); sg.add(d);
  }
  // komin: tylna czesc LEWEJ polaci, przytwierdzony do niej na stale (stoi pionowo)

    const t = .36;
    [[.95, .3, 0, -.5, 0, -1], [.95, .3, 0, .5, 0, 1], [.22, .9, -.42, 0, -1, 0], [.22, .9, .42, 0, 1, 0]].forEach(([w, h, du, dv, ou, ov]) => {
      const b = reg("dach", ink(box(w, h, .02, M.obrobka))); b.position.set(ku + du, kv + dv, t); b.userData = {u:ku + du, v:kv + dv, ou, ov}; layers[6].add(b); obrobka.push(b); });
  }

}

const cam = {tx:0, ty:1.7, tz:.4, r:25, yaw:.62, pitch:.36, fov:32};
const PRESETS = {
  dom:       {tx:2.2, ty:3.4, tz:.4, r:30, yaw:.62, pitch:.26},
  dach:      {tx:4.2, ty:7.6, tz:.6, r:36, yaw:1.22, pitch:.2},
  dachowka:  {tx:1.6, ty:6.2, tz:.2, r:21, yaw:.95, pitch:.36},
  kuna:      {tx:3.4, ty:6.6, tz:.6, r:28, yaw:1.2, pitch:.22},
  elewacja:  {tx:0, ty:3.6, tz:FZ, r:19, yaw:.18, pitch:.1},
  docieplanie:{tx:1.2, ty:3.6, tz:FZ + 2.6, r:25, yaw:1.12, pitch:.12},
  hydro:     {tx:GCX + .6, ty:2.9, tz:GCZ, r:19, yaw:.62, pitch:.8},
  garazPrzed:{tx:DOOR_X, ty:1.15, tz:GZ1, r:10, yaw:0, pitch:.12, fov:36},
  garaz:     {tx:DOOR_X - .2, ty:.85, tz:GZ0 + 1.0, r:6.05, yaw:0, pitch:.17, fov:62},
  podbitka:  {tx:-2.1, ty:5.7, tz:FZ + .3, r:8.2, yaw:-.32, pitch:-.46},
  taras:     {tx:-.2, ty:.5, tz:FZ + 1.2, r:19, yaw:.32, pitch:.46}
};
Object.assign(cam, PRESETS.dom);
const camTw = {from:null, to:null, t0:0, dur:1, on:false};
function camGo(name, dur){ camTw.from = {...cam}; camTw.to = {fov:32, ...PRESETS[name]}; camTw.t0 = performance.now(); camTw.dur = reduce ? 1 : (dur || 1500); camTw.on = true; userYaw = 0; userPitch = 0; }
let userYaw = 0, userPitch = 0;
function applyCam(){
  const yaw = cam.yaw + userYaw, pitch = Math.max(Math.min(.04, cam.pitch), Math.min(1.25, cam.pitch + userPitch));
  // waski ekran (telefon): oddal kamere, zeby caly dom miescil sie w kadrze — poza wnetrzem garazu
  const r = cam.r * (mode === "posadzka" ? 1 : Math.min(1.7, Math.max(1, 1.12 / camera.aspect)));
  camera.position.set(cam.tx + r * Math.cos(pitch) * Math.sin(yaw), cam.ty + r * Math.sin(pitch), cam.tz + r * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  if (Math.abs(camera.fov - cam.fov) > .01){ camera.fov = cam.fov; camera.updateProjectionMatrix(); }
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* ---------- uniwersalne tweeny wartosci S.* */
const S = {roofT:0, wallT:0, eternitOut:0, doorUp:0, glow:0, acryl:0, podb:0, flash:0};
const tweens = [];
function tw(key, to, dur, fn, done){ for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].key === key) tweens.splice(i, 1);
  const from = key in S ? S[key] : 0; tweens.push({key, from, to, t0:performance.now(), dur:reduce ? 1 : dur, fn:fn || ease, done}); }
function tweenVal(get, set, to, dur, done){ const o = {key:"_" + Math.random(), from:get(), to, t0:performance.now(), dur:reduce ? 1 : dur, fn:ease, set, done}; tweens.push(o); }

let hlLayer = null;
let sel = null;      // zaznaczona warstwa: {id, key, nazwa, obj}
function highlightLayer(id){
  const eff = id || (sel ? sel.id : null);
  if (hlLayer && M[hlLayer] && hlLayer !== eff) M[hlLayer].emissive.set(0x000000);
  hlLayer = eff;
  if (eff && M[eff]) M[eff].emissive.copy(HL).multiplyScalar(.35);
  document.querySelectorAll("[data-layer]").forEach(e => e.classList.toggle("on", e.dataset.layer === eff));
}

  if (kind === "pokrycie"){
    h += '<div class="bar-grp"><span class="bar-lbl">Pokrycie</span><div class="tabs">' + ["ceramiczna", "cementowa", "blacha"].map(t => `<button data-typ="${t}" class="${t === roofTyp ? "on" : ""}">${COVER[t].nazwa}</button>`).join("") + "</div></div>";

    h += '<div class="bar-grp"><span class="bar-lbl">Kolor posadzki</span><div class="sw">' + POSADZKA.map(([n, c]) => `<button data-flo="${c}" class="${c === floorState.kolor ? "on" : ""}" style="background:${c}" title="${n}"><span>${n}</span></button>`).join("") + "</div></div>";

const PILLS = {dach:["wymiana", "dachowka"], elewacja:["odnowa", "docieplanie", "podbitka"]};
const hist = [];
function back(){ go(hist.pop() || "dom", true); }
function go(next, fromBack){
  if (next === mode) return;
  if (next === "dom") hist.length = 0; else if (!fromBack) hist.push(mode);
  if (mode !== "dom") MODES[mode].exit();
  sel = null; highlightLayer(null);
  mode = next;
  if (mode !== "dom"){ MODES[mode].enter(); camGo(MODES[mode].cam); }
  else camGo("dom");
  const t = $("#modeTitle");
  if (mode === "dom") t.innerHTML = "";
  else { const list = PILLS[MODES[mode].part] && PILLS[MODES[mode].part].includes(mode) ? PILLS[MODES[mode].part] : [mode];
    t.innerHTML = list.map(m => `<button type="button" data-go="${m}" class="${m === mode ? "on" : ""}">${MODES[m].krotko}</button>`).join(""); }
  $("#navBack").classList.toggle("off", mode === "dom");
  $("#tip").textContent = mode === "posadzka" ? "zmieniaj kolor posadzki pod sceną" : "przeciągnij, aby obrócić · kliknij część domu";
  renderPanel(); renderBar(); renderCallout(); renderGal();
}

  const cv_ = e.target.closest("[data-cover]"); if (cv_){ setCover(roofTyp, cv_.dataset.cover); renderBar(); if (mode === "wymiana") renderPanel(); return; }
  const f = e.target.closest("[data-fas]"); if (f){ setFacade(f.dataset.fas); renderBar(); return; }
  const fl = e.target.closest("[data-flo]"); if (fl){ setFloor(fl.dataset.flo); renderBar(); return; }

  if (e.target.id === "bAkryl"){ S.acryl = 0; tw("acryl", 1, 2400); return; }
  if (e.target.id === "bPodb"){ S.podb = 0; tw("podb", 1, 4200, t => t); return; }
  if (e.target.id === "bZloz"){ tw("roofT", S.roofT > .5 ? 0 : 1, 1500); return; }
  if (e.target.id === "bEternit"){ eternitShow(); return; }

/* demontaz eternitu: stare pokrycie odlatuje, nowe laduje na lacie */
let eternitBusy = false;
function eternitShow(){
  if (eternitBusy) return; eternitBusy = true;
  const typ = roofTyp, kolor = coverState.kolor;
  if (S.roofT < .9) tw("roofT", 1, 900);
  setTimeout(() => {
    setCover("eternit", "#8d918c"); S.eternitOut = 0; M.pokrycie.opacity = 1;
    setTimeout(() => tw("eternitOut", 1, 1500, ease, () => {
      setCover(typ, kolor);
      S.eternitOut = 2.4; tw("eternitOut", 0, 1500, easeOut, () => { eternitBusy = false; });
    }), 900);
  }, S.roofT < .9 ? 950 : 50);
}

/* ---------- wskazanie mysza (raycast) + obrot */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const pickables = () => Object.values(parts).flat();
let drag = null, moved = 0;
function pickHit(ev){ const r = cv.getBoundingClientRect(); mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera); return ray.intersectObjects(pickables(), false)[0] || null; }
function pick(ev){ const h = pickHit(ev); return h ? h.object.userData.part : null; }
function warstwaZHit(h){ let g = h && h.object; while (g && !(g.userData && g.userData.warstwa)) g = g.parent; return g || null; }
function rozlozona(g){ const w = g.userData.warstwa; return (w.startsWith("dach-") && S.roofT > .4) || (w.startsWith("sciana-") && S.wallT > .4); }
cv.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, yaw:userYaw, pitch:userPitch}; moved = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (drag){ const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 4){ cv.classList.add("drag"); userYaw = drag.yaw - dx * .005; userPitch = Math.max(-.35, Math.min(.5, drag.pitch + dy * .004)); } return; }
  const p = pick(e); if (p !== hoverPart){ hoverPart = p; cv.classList.toggle("hov", !!p); }
});
cv.addEventListener("pointerup", e => { cv.classList.remove("drag"); const was = drag; drag = null;
  if (was && moved <= 4){ const h = pickHit(e), g = warstwaZHit(h);
    if (g && rozlozona(g)){ selectLayer(g.userData.warstwa.replace(/^(dach|sciana)-/, ""), g); return; }
    const p = h ? h.object.userData.part : null; if (p){ const list = GROUPS[p]; go(list.includes(mode) ? mode : list[0]); } } });
cv.addEventListener("pointerleave", () => { hoverPart = null; cv.classList.remove("hov"); });

fetch("../galeria/manifest.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : {}).then(j => { GAL_DATA = j || {}; renderCallout(); renderGal(); }).catch(() => {});
const galSrc = p => /^(https?:)?\//.test(p) ? p : "../galeria/" + p;

function selectLayer(id, obj){
  if (!id || (sel && sel.id === id)){ sel = null; }
  else {
    const roof = ROOF_LAYERS.findIndex(l => l.id === id), wall = WALL_LAYERS.findIndex(l => l.id === id);
    const kind = roof >= 0 ? "dach" : "sciana", idx = roof >= 0 ? roof : wall;
    if (idx < 0) return;
    const grp = obj || (kind === "dach" ? roofSlopes[0].layers[idx] : wallLayers[idx]);
    sel = {id, key:kind + "-" + id, kind, obj:grp};
  }
  highlightLayer(null); renderCallout(); renderGal();
}
const coEl = $("#callout"), leadEl = $("#leadLine"), leadPath = $("#leadPath"), leadDot = $("#leadDot");
function renderCallout(){
  if (!sel){ coEl.hidden = true; leadEl.hidden = true; return; }
  const o = OPISY[sel.key] || [sel.id, ""], foto = (GAL_DATA.opisy || {})[sel.key] && GAL_DATA.opisy[sel.key].foto;
  let tyt = o[0]; if (sel.key === "dach-pokrycie") tyt = "Wymiana pokrycia — " + COVER[coverState.typ].nazwa.toLowerCase().replace("dachówka ", "dachówka ");
  coEl.innerHTML = `<button class="co-x" type="button" aria-label="Zamknij">×</button><div class="co-foto">${foto ? `<img src="${galSrc(foto)}" alt="">` : ""}</div><div class="co-tyt">${tyt}</div><p class="co-txt">${o[1]}</p>`;
  coEl.hidden = false; leadEl.hidden = false;
}
const _v = new THREE.Vector3(), _b = new THREE.Box3();
function updateLead(){
  if (!sel || coEl.hidden){ return; }
  const sr = stage.getBoundingClientRect(), cr = coEl.getBoundingClientRect();
  _b.setFromObject(sel.obj); if (_b.isEmpty()){ leadEl.hidden = true; return; } leadEl.hidden = false;

  const px = (_v.x * .5 + .5) * sr.width, py = (-_v.y * .5 + .5) * sr.height;

  leadPath.setAttribute("d", `M ${x0} ${yb} H ${x1} L ${px} ${py}`);

/* =========================================================== PETLA */
function resize(){ const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

const tmp = new THREE.Vector3();
function project(v){ tmp.copy(v).project(camera); const r = cv.getBoundingClientRect();
  return {x:(tmp.x * .5 + .5) * r.width, y:(-tmp.y * .5 + .5) * r.height, vis:tmp.z < 1}; }

let hoverK = 0;
function frame(now){
  // tweeny
  for (let i = tweens.length - 1; i >= 0; i--){ const t = tweens[i]; const k = Math.min(1, (now - t.t0) / t.dur); const v = t.from + (t.to - t.from) * t.fn(k);
    if (t.set) t.set(v); else S[t.key] = v; if (k >= 1){ tweens.splice(i, 1); t.done && t.done(); } }
  if (camTw.on){ const k = Math.min(1, (now - camTw.t0) / camTw.dur), e = ease(k);
    for (const key of ["tx", "ty", "tz", "r", "yaw", "pitch", "fov"]) cam[key] = camTw.from[key] + (camTw.to[key] - camTw.from[key]) * e;
    if (k >= 1) camTw.on = false; }
  if (!drag && mode === "dom" && !camTw.on && !reduce) userYaw = Math.sin(now * .00018) * .16;   // delikatny "oddech" kamery
  applyCam();

  // rozklad dachu: kazda warstwa odsuwa sie wzdluz normalnej polaci, cala polac odlatuje od budynku
  const rt = S.roofT;
  for (const sl of roofSlopes){ sl.layers.forEach((l, i) => {
    let z = rt * (.7 + i * .85);
    if (i === 6) z += S.eternitOut * 3.2;
    l.position.z = z; }); }
  for (const b of obrobka){ const k = S.flash; b.position.x = b.userData.u + b.userData.ou * k * .9; b.position.y = b.userData.v + b.userData.ov * k * .9;
    b.position.z = .36 + k * .45 + rt * 0; }
  // podbitka: 0-.3 stare deski odpadaja, .3-.55 nowe wjezdzaja, .55-1 impregnacja (kolor wyblakly -> drewno)
  { const p = S.podb, out = Math.min(1, p / .3), inn = Math.max(0, Math.min(1, (p - .3) / .25)), imp = Math.max(0, Math.min(1, (p - .55) / .45));
    podbStare.forEach(g => { g.position.z = -.03 - out * 1.2; g.visible = out < .99; g.rotation.x = out * .5; });
    podbNowe.forEach(n => { n.visible = inn > .001; n.position.z = n.userData.base.z - (1 - easeOut(inn)) * 1.2; });
    M.podbitka.color.copy(PODB_FADE).lerp(PODB_IMP, imp);
    M.podbitka.emissive.set(0xc05a3c).multiplyScalar(imp > 0 && imp < 1 ? .18 * Math.sin(imp * Math.PI) : 0); }
  M.pokrycie.opacity = 1 - Math.min(1, Math.max(0, S.eternitOut - 1.2));
  M.pokrycie.depthWrite = M.pokrycie.opacity > .99;
    // rozklad sciany: warstwy odsuwaja sie od muru (+z)
  wallLayers.forEach(g => { g.position.z = g.userData.base + S.wallT * g.userData.idx * .85; });
  // akryl: obwodka "rysuje sie" wokol otworow (gora -> prawa -> dol -> lewa), potem lekko swieci
  for (const m of akryl){ const k = Math.max(0, Math.min(1, S.acryl * 4 - m.userData.j));
    m.visible = k > .001; if (m.userData.ax === "x") m.scale.set(k, 1, 1); else m.scale.set(1, k, 1); }
  M.akryl.emissiveIntensity = S.acryl > 0 ? (S.acryl < 1 ? .55 : .15 + .3 * (.5 + .5 * Math.sin(now * .005))) : 0;
  // brama garazu
  brama.position.y = S.doorUp * (DOOR_H - .15); brama.scale.y = 1 - S.doorUp * .85;
  // podswietlenie tarasu (pulsuje w trybie taras)
  const glowK = S.glow * (.18 + .1 * Math.sin(now * .004));
  M.kamien.emissive.set(0xc05a3c).multiplyScalar(glowK); M.kamienS.emissive.copy(M.kamien.emissive);
  // hover czesci
  hoverK += ((hoverPart ? 1 : 0) - hoverK) * .2;
  for (const p of Object.keys(parts)) if (p !== "taras") partEmissive(p, p === hoverPart ? .12 * hoverK : 0);
  if (hoverPart === "taras" && S.glow < .05){ M.kamien.emissive.copy(HL).multiplyScalar(.12 * hoverK); M.kamienS.emissive.copy(M.kamien.emissive); }
  if (hlLayer && M[hlLayer]) M[hlLayer].emissive.copy(HL).multiplyScalar(.45 + .15 * Math.sin(now * .006));

  renderer.render(scene, camera);

  // etykiety czesci (chowane w trybach)
  for (const h of HOTS){ const p = project(h.pos); h.el.style.left = p.x + "px"; h.el.style.top = p.y + "px";
    h.el.classList.toggle("off", mode !== "dom" || !p.vis); }
  // etykiety warstw dachu (przednia polac) i sciany
  const front = roofSlopes[0];
  for (const o of LY){
    let show = false, wp = null;
    if (o.kind === "roof" && rt > .35 && (mode === "wymiana" || (mode === "kuna" && o.idx < 4))){
      const l = front.layers[o.idx]; wp = new THREE.Vector3(front.W0 * .5 - .25, front.L * .12, .2);
      l.localToWorld(wp); show = true;
    }
    if (o.kind === "wall" && S.wallT > .35 && mode === "docieplanie"){
      const g = wallLayers[o.idx]; wp = new THREE.Vector3(W / 2, H + GABLE * .15 - o.idx * .55, WALL_LAYERS[o.idx].th / 2); g.localToWorld(wp); show = true;
    }
    if (show){ const p = project(wp); o.el.style.left = (p.x + 10) + "px"; o.el.style.top = p.y + "px"; }
    o.el.style.opacity = show ? Math.min(1, (o.kind === "roof" ? rt : S.wallT) * 1.6 - .5) : 0;
    o.el.style.pointerEvents = show ? "auto" : "none"; o.el.style.visibility = show ? "visible" : "hidden";
    if (o.kind === "roof" && o.idx === 6) o.el.innerHTML = `<em>7</em>Pokrycie — ${COVER[coverState.typ].nazwa.toLowerCase()}`;
  }
  { const on = mode === "wymiana" || mode === "dachowka" || mode === "kuna";
    const p = project(RYNNA_ETYK); rynnaLbl.style.left = (p.x + 10) + "px"; rynnaLbl.style.top = p.y + "px";
    rynnaLbl.style.opacity = on && p.vis ? 1 : 0; rynnaLbl.style.visibility = on ? "visible" : "hidden";
    M.rynnaWym.emissiveIntensity = on ? .35 + .25 * Math.sin(now * .004) : 0; }
  updateLead();
  requestAnimationFrame(frame);
}

setCover("blacha", COVER.blacha.kolory[0][1]);
renderPanel(); renderBar(); renderGal();
requestAnimationFrame(frame);

/* osadzenie na stronie glownej (iframe): podaj rodzicowi wysokosc tresci */
if (window.parent !== window){
  document.documentElement.classList.add("embed");
  const sec = document.getElementById("dom3d");
  const send = () => parent.postMessage({type:"dom3d-h", h:sec.getBoundingClientRect().height}, "*");
  new ResizeObserver(send).observe(document.body); addEventListener("load", send); send();
}
})();
</script>
</body>
